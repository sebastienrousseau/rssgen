name: Release

# Drives the release flow via release-plz:
#
#  * On every push to main, opens (or updates) a "release PR" with
#    the bumped version, the regenerated CHANGELOG, and the inferred
#    git-cliff section.
#  * When that PR merges, tags the new version, creates a GitHub
#    release, and publishes to crates.io.
#
# Tokens required (set as repo secrets):
#  * `CARGO_API_TOKEN` — crates.io API token with `publish-update` scope.
#  * `RELEASE_PLZ_TOKEN` — fine-grained GitHub PAT with `contents: write`
#    and `pull-requests: write`. Falls back to GITHUB_TOKEN if absent
#    (but note: PRs opened by GITHUB_TOKEN don't trigger CI on the
#    release PR, so the PAT is strongly preferred).

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'sebastienrousseau' }}
    permissions:
      contents: write
      # Mints the OIDC token crates.io exchanges for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # Trusted publishing: swaps this job's GitHub OIDC identity for a
      # temporary crates.io token, revoked by the action's post step when
      # the job ends. release-plz shells out to cargo, which reads
      # CARGO_REGISTRY_TOKEN from the environment, so handing it the
      # temporary token needs no release-plz-specific support.
      #
      # Needs a trusted publisher on crates.io for the rss-gen crate:
      # repository sebastienrousseau/rssgen, workflow release-plz.yml.
      # Note the workflow filename is release-plz.yml here, not
      # release.yml as in the other repositories.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release-plz-pr:
    name: release-plz release-PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'sebastienrousseau' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
